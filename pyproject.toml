[project]
name = "marketplace-listing-agent"
version = "0.1.0"
description = "Local-first, human-in-the-loop agent for researching prices and preparing marketplace listings."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "aiosqlite>=0.21,<0.22",
  "beautifulsoup4>=4.13",
  "httpx>=0.28",
  "langgraph>=1.1,<1.2",
  "langgraph-checkpoint-sqlite>=3.0",
  "mcp>=2,<3",
  "ollama>=0.6",
  "playwright>=1.60,<1.61",
  "psutil>=7.0",
  "pydantic>=2.11",
  "pydantic-settings>=2.10",
  "python-telegram-bot>=22.0",
  "pyyaml>=6.0",
  "tenacity>=9.1",
  "typer>=0.16",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4",
  "pytest-asyncio>=1.1",
  "pytest-cov>=6.2",
  "ruff>=0.12",
]

[project.scripts]
marketplace-listing-agent = "marketplace_agent.cli:app"
marketplace-listing-agent-mcp = "marketplace_agent.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/marketplace_agent"]

[tool.hatch.build.targets.wheel.force-include]
"config" = "marketplace_agent/defaults/config"
"goldens" = "marketplace_agent/defaults/goldens"

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = [".", "src"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv", ".uv-cache"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
